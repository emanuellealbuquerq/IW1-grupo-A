<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
  </head>
  <body>
    <div class="container">
      <button class="home">Home</button>

      <div class="cadastro">
        <h1>Faça seu cadastro</h1>

        <label>Login</label>
        <input type="text" />

        <label>Senha</label>
        <input type="password" />

        <label>Nome</label>
        <input type="text" />

        <label>Email</label>
        <input type="email" />

        <div class="botoes">
          <button>Cancelar</button>
          <button>Cadastrar</button>
        </div>
      </div>
    </div>
  </body>

  <style>
    body {
      margin: 0;

      height: 100vh;

      background: #1e1e1e;

      display: flex;

      justify-content: center;

      align-items: center;

      font-family: Arial;
    }

    .container {
      width: 100%;

      height: 100vh;

      background: #e6baff;

      border-radius: 25px;

      position: relative;

      display: flex;

      justify-content: center;

      align-items: center;
    }

    .home {
      position: absolute;

      top: 20px;

      left: 20px;

      background: #9200e5;

      color: white;

      border: none;

      border-radius: 10px;

      padding: 10px 25px;

      font-weight: bold;
    }

    .cadastro {
      width: 500px;

      background: #d28bfa;

      padding: 40px;

      border-radius: 30px;

      display: flex;

      flex-direction: column;

      gap: 15px;
    }

    h1 {
      color: white;

      text-align: center;

      font-size: 50px;

      margin-top: 0;
    }

    input {
      height: 45px;

      border: none;

      border-radius: 15px;

      background: #b45ae9;

      padding-left: 15px;

      font-size: 18px;

      color: white;
    }

    label {
      color: white;

      font-size: 25px;
    }

    .botoes {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 20px;

      margin-top: 20px;
    }

    .botoes button {
      background: white;

      color: #9200e5;

      border: none;

      border-radius: 15px;

      padding: 12px 30px;

      font-size: 20px;

      font-weight: bold;
    }
  </style>
</html>
