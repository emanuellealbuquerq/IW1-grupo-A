<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
     <div class="container">

<div class="topo">

    <div class="menu">
        <button>Home</button>
        <button>Sobre a empresa</button>
        <button>Cadastro</button>
    </div>

     <div class="pagina">
    <img class="imagem-fundo" src="fundo.jpg">
    <img class="titulo" src="que (1).png">
    </div>

    <footer>
    Dirigido por Gil Junger e escrito por Karen McCullah Lutz e Kristen Smith
   </footer>
    </div>

</body>
</html>

<style>

 body {
    margin:0;
    height:100vh;
    background-color:#1E1E1E;;
 }
 .container {
                   width:100%;
                   min-height:100vh;
                   background:#EBE0B2;
                   box-sizing:border-box;
                 } 
 .menu{
                   display:flex;
                   gap: 15px;
                   background-color:#A9101A;
                   color:#EBE0B2;
                   height: 50px;
                   padding-left: 20px;
                 }
 .menu button,
 .home button{
                   background:#EBE0B2;
                   color:#A9101A;
                   border:none;
                   padding:10px 45px;
                   border-radius:30px;
                   font-weight:bold;
                   cursor:pointer;
                   height: 40px;
                 }

.pagina {
                   width: 100%;
                   height: 100vh;
                   position: relative;
                   overflow: hidden;
                 }

.imagem-fundo {
                  width: 100%;
                  height: 100%;
                  object-fit: cover;
                  position: absolute;
                 }
.titulo {
                 position: absolute;
                 width: 45%;
                 right: 7%;
                 top: 35%;
                 z-index: 2;
                 }

 footer {
                    height: 20px;
                    background-color: #A9101A;
                    color:#EBE0B2;
                    display: flex;
                    align-items: center;
                    padding:10px 45px;
                    cursor:pointer;
                    padding-left: 20px;
                 }
</style>
</html>
